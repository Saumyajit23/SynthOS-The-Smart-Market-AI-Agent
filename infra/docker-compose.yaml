version: '3.8'

services:

  # ── The Memory: Milvus (Vector Database) for RAG ──────────────────────────
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # ── The Hands: n8n for automation ─────────────────────────────────────────
  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/n8n:/home/node/.n8n

  # ── The LLM: Ollama (Automatic GPU / CPU Fallback) ────────────────────────
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/ollama:/root/.ollama
    restart: unless-stopped
    # GPU Access: If NVIDIA Container Toolkit is installed, Docker will bind the GPU.
    # # If not present or running on pure CPU machines, Ollama defaults gracefully to CPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── The Brain: FastAPI backend ─────────────────────────────────────────────
  backend:
    container_name: synthos-backend
    build:
      context: ..
      dockerfile: brain/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - milvus
      - ollama
    restart: unless-stopped

  # ── The Face: Next.js frontend ────────────────────────────────────────────
  frontend:
    container_name: synthos-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped