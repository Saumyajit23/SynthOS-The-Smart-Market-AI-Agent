# ── Ingress — single entry point for all external traffic ─────────────────────
# Requires nginx ingress controller:
# minikube: run `minikube addons enable ingress` before applying
# cloud:    install via `kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml`

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthos-ingress
  namespace: synthos
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"    # SSE needs long timeout
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"    # deep analysis takes time
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # required for SSE streaming
spec:
  ingressClassName: nginx
  rules:
    - host: synthos.local              # change to your domain in production
      http:
        paths:
          # ── Frontend — catch all routes ──────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

          # ── Backend API — /analyze and /analyze/deep ─────────────────────
          - path: /analyze
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

          # ── Backend docs — useful for debugging ──────────────────────────
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000